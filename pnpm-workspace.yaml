# Keep host-native binaries for builds and Linux ARM64 binaries for Lambda.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc

allowBuilds:
  # Swagger UI's optional installation analytics do not need to run.
  '@scarf/scarf': false
  sharp: true
  esbuild: true
  unrs-resolver: true
